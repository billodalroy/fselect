[project]
name = "fselect"
version = "1.1.0"
description = "Feature Selection for Clustering"
authors = [{ name = "Billodal Roy", email = "billodalroy@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # On Python >=3.11, require a scipy that ships cp31x wheels (incl. 3.14).
    # Older scipy (the only one that also supports 3.10) has no 3.14 wheel and
    # would otherwise be built from source. This marker lets uv fork the lock.
    "scipy>=1.16; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/billodalroy/fselect"
Repository = "https://github.com/billodalroy/fselect"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fselect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
